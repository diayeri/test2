<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrap">
      <form>
        <h1>로그인</h1>
        <div class="id">
          <label for="user">아이디</label>
          <input id="user" name="username" placeholder="아이디" />
        </div>
        <div class="date">
          <label for="date">생년월일</label>
          <input id="date" name="date" type="date" />
        </div>
        <div class="file">
          <label for="file">파일</label>
          <input id="file" name="file" type="file" />
        </div>
        <div class="number">
          <label for="user">연락처</label>
          <input id="user" name="username" placeholder="연락처" />
        </div>
        <label for="genre">지역</label>
        <select id="genre" name="genre">
          <option value="korean">서울</option>
          <option value="foreign">경기</option>
          <option value="drama">부산</option>
          <option value="documentary">경남</option>
          <option value="vareity">충북</option>
        </select>
        <div class="button1">
          <button type="submit">타입 서브밋 로그인</button>
          <button>버튼 로그인</button>
        </div>
        <div class="button2">
          <button type="reset">초기화</button>
          <button type="button">취소</button>
        </div>
      </form>
    </div>
  </body>
</html>
