<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html {
        min-height: 300vh;
      }

      body {
        margin: 0;
        padding: 0;
      }

      header {
        height: 50px;
        width: 100%;
        background-color: #aaa;

        position: fixed;
        top: 0;
        right: 20px;
        z-index: 100;
      }

      main {
        position: relative;
        margin-top: 80px;
        width: 600px;
      }

      .yellow {
        width: 500px;
        height: 500px;
        background-color: #a0a000;
        /* position: relative; */
        z-index: 20;
        /* display: flex; */
        /* flex-direction: column; */
        /* align-items: flex-end; */
      }

      .red {
        width: 400px;
        height: 400px;
        background-color: #a00000;
        position: relative;
      }

      .green {
        display: inline-box;
        width: 300px;
        height: 100px;
        border: 2px solid #000;
        background-color: #00a000;

        position: sticky;
        /* position: relative; */
        top: 60px;
        /* left: 20px; */
        right: 20px;
        z-index: 10;
        /* margin-left: auto; */
        /* margin-right: 20px; */
      }

      .blue {
        width: 100px;
        height: 100px;
        background-color: #0000a0;

        position: absolute;
        right: 0;
        bottom: 0;
      }

      .white {
        width: 50px;
        height: 50px;
        background-color: #ffffff;

        position: absolute;
        left: 10px;
        top: 10px;
      }
    </style>
  </head>
  <body>
    <header>헤더입니다</header>
    <main>
      <h1>박스의 포지션 테스트</h1>
      <div class="flex yellow">
        <div class="green">챗봇:설명해드릴게요</div>
        <div class="red">
          <div class="blue">
            <div class="white"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
